services:
  postgis:
    image: postgis/postgis:17-3.5
    # This upstream tag currently has no linux/arm64 manifest. Docker Desktop
    # runs the amd64 image under emulation on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: greenchanger_test
      POSTGRES_USER: greenchanger_test
      POSTGRES_PASSWORD: greenchanger_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenchanger_test -d greenchanger_test"]
      interval: 2s
      timeout: 3s
      retries: 30
