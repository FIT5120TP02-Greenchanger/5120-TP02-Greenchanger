name: CI

on:
  pull_request:
    paths:
      - "GreenChanger_data/**"
      - ".github/workflows/greenchanger-postgis.yml"
  push:
    branches:
      - main
      - greenchanger-ds
    paths:
      - "GreenChanger_data/**"
      - ".github/workflows/greenchanger-postgis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgis-integration:
    name: postgis-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: greenchanger_test
          POSTGRES_USER: greenchanger_test
          POSTGRES_PASSWORD: greenchanger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenchanger_test -d greenchanger_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    defaults:
      run:
        working-directory: GreenChanger_data

    env:
      GREENCHANGER_TEST_DATABASE_URL: postgresql://greenchanger_test:greenchanger_test@127.0.0.1:5432/greenchanger_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: GreenChanger_data/requirements.txt

      - name: Install data-component dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Apply migrations and execute spatial contracts
        run: python -m unittest tests.test_postgis_integration -v
