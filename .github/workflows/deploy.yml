

# flow: git pull  →  docker build/run (backend)  →  npm build → swap /srv/greenchanger/web (frontend)
#
# The frontend is built ON the box rather than on the runner because SSM can only
# run commands, not transfer files -- shipping a dist/ from the runner would mean
# an S3 bucket and a presigned URL just to move 700 KB. A 2 GB swapfile makes the
# 908 MB instance comfortable: the build peaks at ~80 MB of swap and takes ~8s.
#
# Publishing the built frontend lives in .github/scripts/publish-frontend.sh rather
# than inline here, so that CI can run the real sequence against a temp directory --
# see test-publish-frontend.sh. It is the one part of this workflow CI can exercise.
#
# api-prev is kept until the frontend has published, so a frontend failure still
# leaves a working container to fall back to. The backend is not rolled back on a
# frontend failure -- it passed its own healthcheck and reverting it would undo a
# good deployment.

name: Deploy



# the workflow is triggered if:
on:
  push:
    branches: [main] # when merge to main will trigger deploy

    # only trigger if the following files are changed
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# permissions required for the workflow to run
permissions:
  id-token: write # required for OIDC authentication
  contents: read # required to read the repo content

# aws region to deploy to
env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # the role to assume in the target account
          aws-region: ${{ env.AWS_REGION }} # the region to deploy to

      - name: Send deploy command
        id: send
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=[
              "set -euo pipefail",
              "TAG=greenchanger-api:${{ github.sha }}",
              "cd /home/ubuntu/app",
              "sudo -u ubuntu git fetch --depth 1 origin main",
              "sudo -u ubuntu git reset --hard origin/main",
              "cd backend",
              "docker build -t $TAG .",
              "docker rm -f api-prev 2>/dev/null || true",
              "docker rename api api-prev 2>/dev/null || true",
              "docker stop api-prev 2>/dev/null || true",
              "docker run -d --name api --restart unless-stopped -p 8000:8000 $TAG",
              "sleep 5",
              "if curl -fsS localhost:8000/api/health >/dev/null; then echo backend deployed $TAG; else echo healthcheck failed, rolling back; docker rm -f api; docker rename api-prev api; docker start api; exit 1; fi",
              "cd /home/ubuntu/app/frontend",
              "cp /home/ubuntu/frontend.env .env.production",
              "sudo -u ubuntu npm ci --no-audit --no-fund",
              "sudo -u ubuntu npm run build",
              "bash /home/ubuntu/app/.github/scripts/publish-frontend.sh dist /srv/greenchanger www-data:www-data",
              "docker rm -f api-prev 2>/dev/null || true",
              "docker image prune -f"
            ]' \
            --query Command.CommandId --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for it to finish
        run: |
          # `aws ssm wait command-executed` gives up after 100s (5s x 20 attempts),
          # which a cold docker build exceeds -- it would report a false failure on
          # a deploy that is still running. Poll for a terminal status instead.
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "${{ vars.INSTANCE_ID }}" \
              --query Status --output text)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ vars.INSTANCE_ID }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text

          echo "status: $STATUS"
          [ "$STATUS" = "Success" ]


